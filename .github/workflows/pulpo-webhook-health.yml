name: Pulpo webhook health

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Post a one-line test ping to Slack and exit (verify alert wiring). Skips the real checks."
        type: boolean
        default: false

# Post-2026-06-02 (PRD P0-1 + P0-2): the heavy Clerk/Resend API calls
# now run from the Vercel serverless function at
# /api/internal/webhook-health so they survive Cloudflare 1010 from
# the GH-Actions runner. This workflow stays as a thin poller that
# pings the endpoint AND keeps the PostHog-side heartbeat composer
# (which queries event timelines, not provider APIs) as an independent
# observability surface.

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      # PRD P0-1/P0-2 — Cloudflare 1010 blocks api.clerk.com and
      # api.resend.com from the GH-Actions runner. The provider-side
      # checks now run on the Vercel serverless function at
      # /api/internal/webhook-health; this poll proves the endpoint is
      # alive AND surfaces a red badge when the per-monitor status is
      # `unavailable`.
      - name: Poll Vercel webhook-health endpoint
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_slack) }}
        env:
          PULPO_HEALTH_URL: ${{ secrets.PULPO_HEALTH_URL }}
          PULPO_CRON_SECRET: ${{ secrets.PULPO_CRON_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/poll_webhook_health_endpoint.py

      # Run the per-provider PostHog-based monitors FIRST so they drop
      # their status sidecars in $MONITOR_STATUS_DIR. The heartbeat step
      # below reads those sidecars to compose
      # `monitor.webhook_health_completed` with `{clerk_status,
      # resend_status, stripe_status}`. Missing sidecar → status="unknown"
      # so a crashed monitor is observable.
      - name: Check stuck activation invitations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_slack) }}
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_INGEST_HOST: ${{ secrets.POSTHOG_INGEST_HOST }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MONITOR_STATUS_DIR: ${{ runner.temp }}/pulpo_monitor_status
        run: python3 scripts/check_stuck_invitations.py

      - name: Check webhook family heartbeats (composes monitor.webhook_health_completed)
        env:
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_INGEST_HOST: ${{ secrets.POSTHOG_INGEST_HOST }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MONITOR_STATUS_DIR: ${{ runner.temp }}/pulpo_monitor_status
        run: python3 scripts/check_webhook_health.py ${{ (github.event_name == 'workflow_dispatch' && inputs.test_slack) && '--test-slack' || '' }}

      # ACTIVE probe, as opposed to the passive heartbeat above. The
      # `telegram` family in check_webhook_health.py notices that events
      # stopped arriving, which for an organic-traffic bot is slow and
      # ambiguous ("nobody messaged us" is not an outage). This asks
      # Telegram directly whether our webhook is still registered, still
      # pointed at production, and still being delivered to — so a
      # deregistration or a rotated secret is caught even with zero
      # users. Never blocks: it Slacks and exits 0.
      - name: Probe Telegram webhook registration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/check_telegram_webhook.py

      # LIVE probe of the public API. The build-time guardrails cannot
      # see this failure class: on 2026-08-25 every /api/v1 and /api/mcp
      # endpoint returned 500 while CI was fully green, because the
      # fault existed only in Vercel's emitted bundle. It was found by a
      # human days later. This is the alarm that would have caught it,
      # and it checks response SHAPE too — an endpoint serving an empty
      # catalog is as broken as one that 500s. Never blocks: Slacks and
      # exits 0.
      - name: Probe the public API (v1 + MCP)
        env:
          PULPO_API_BASE: ${{ vars.PULPO_API_BASE || 'https://pulpo.club' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/check_api_health.py

      - name: Slack on webhook-health job failure
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL unset; skipping webhook-health failure Slack ping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            "$SLACK_WEBHOOK_URL" \
            -d "$(printf '{"text":"*Pulpo webhook-health JOB FAILED* — monitor may be silent. <%s|view run>"}' "$RUN_URL")" \
            >/dev/null || echo "Slack POST failed (non-blocking)"
