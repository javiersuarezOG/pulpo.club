name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual dispatch — used by pulpo-nightly.yml to force-trigger CI on
  # data-only nightly PRs whose pushes were authored by GITHUB_TOKEN
  # (Actions doesn't trigger downstream workflows from such pushes,
  # leaving the required `pytest` check stuck on "Expected — Waiting").
  workflow_dispatch: {}

jobs:
  ci:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.10"
          cache: pip

      # System binary for pytesseract (text-overlay detector tests in
      # tests/test_photo_quality.py). Without it, the positive-case
      # tests skip cleanly via @pytest.mark.skipif — kept here so the
      # behavior tests run on every PR rather than only on the nightly.
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Test
        env:
          PULPO_OFFLINE: "1"
        run: pytest -q

      - name: Lint
        run: ruff check .

      # PR-MC-PA-4 guardrail — catches SV-only string literals creeping
      # into country-agnostic code (the bug class fixed in #489: three
      # hardcoded "SV" / "El Salvador" / multi-country regex literals
      # silently dropped every PA listing). Existing legitimate hits
      # are inline-marked with `# multi-country-exempt: <reason>`; the
      # script reports zero hits on a clean tree.
      - name: Country-hardcode guard
        run: python3 scripts/check_country_hardcodes.py

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint:css
      # Static i18n guard — catches hardcoded English in JSX attribute
      # strings (`aria-label`, `placeholder`, `alt`, `title`) under
      # web/app/. ~1s, runs before the heavier checks. See
      # scripts/i18n_lint.mjs and CLAUDE.md → "i18n".
      - run: node scripts/i18n_lint.mjs
      - run: node scripts/check_e2e_stale_selectors.mjs
      - name: CSP allowlist drop guard
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::Base SHA $BASE_SHA is not available in checkout; falling back to HEAD^"
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node scripts/diff_csp_allowlist.mjs "$BASE_SHA"
      # Version-bump guards — mandatory for any PR touching home block
      # components OR newsletter template modules. Without these, the
      # /api/home/version and /api/admin/newsletter/template-version
      # endpoints quietly serve stale version strings for experiences
      # that already shipped a change. See the scripts for the policy.
      - name: home versions.json bump guard
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::Base SHA $BASE_SHA is not available in checkout; falling back to HEAD^"
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node scripts/diff_home_version.mjs "$BASE_SHA"
      - name: newsletter TEMPLATE_VERSION bump guard
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::Base SHA $BASE_SHA is not available in checkout; falling back to HEAD^"
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node scripts/diff_newsletter_version.mjs "$BASE_SHA"
      - run: npm run test --if-present
      - name: Build (capture log for mixed-import check)
        run: npm run build 2>&1 | tee /tmp/pulpo-build.log
      # Mixed static+dynamic imports defeat Vite chunk splitting (PR-5B
      # caught stripe-checkout.js + telemetry/perf.ts). This gate fails
      # CI if the regression returns.
      - run: node scripts/check_mixed_imports.mjs /tmp/pulpo-build.log
      - run: npm run check:size

  e2e-critical:
    name: e2e critical
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run build
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/pulpo-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pulpo-preview.log
          exit 1
      - name: e2e critical (against the built preview)
        # E2E_BASE_URL points Playwright at the preview server started
        # above. Per playwright.config.ts this ALSO disables Playwright's
        # own `webServer` (npm run dev) — which otherwise raced for port
        # 5173 against the preview and failed every run with
        # "http://localhost:5173 is already used". One server, one port.
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run e2e:critical

  # The full e2e (Playwright smoke) job was REMOVED from PR-triggered CI on
  # 2026-05-25. Rationale: the suite spent more time red on PR pages
  # than green — selector drift across surfaces that evolved faster
  # than tests were maintained kept failing PRs that touched
  # completely unrelated code (e.g. backend ranker tweaks blocked by
  # broken homepage UI specs). The ~10-13 min runtime amplified the
  # friction. Pruning broken specs (#445) helped briefly but the
  # arms race wasn't sustainable for a small team.
  #
  # The tests themselves still live under `tests/e2e/` and the npm
  # scripts still work locally:
  #
  #     npm run dev    # in one terminal
  #     npm run e2e:critical    # PR gate subset
  #     npm run e2e:responsive  # visual/responsive sweep before UI PRs
  #     npm run e2e:legacy      # quarantined retired surfaces
  #     npm run e2e:smoke       # full local sweep
  #
  # Anyone investigating a UI regression can run them on demand. The
  # responsive-smoke spec specifically (the 5-viewport overflow guard)
  # remains the high-value sweep — run it before merging visual PRs.
  #
  # What remains as PR gates: pytest, frontend (typecheck + build),
  # contract, Vercel preview. The pulpo-nightly canary gates + the
  # manual Stripe-sandbox checklist in CLAUDE.md cover what CI can't
  # see (real Clerk, real Stripe).
  #
  # If we ever want the suite back, restore the job from git history
  # at this commit or move it to a nightly cron in a separate
  # workflow file so PRs aren't gated by it.
