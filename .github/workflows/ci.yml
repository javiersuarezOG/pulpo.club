name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual dispatch — used by pulpo-nightly.yml to force-trigger CI on
  # data-only nightly PRs whose pushes were authored by GITHUB_TOKEN
  # (Actions doesn't trigger downstream workflows from such pushes,
  # leaving the required `pytest` check stuck on "Expected — Waiting").
  workflow_dispatch: {}

jobs:
  ci:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.10"
          cache: pip

      # System binary for pytesseract (text-overlay detector tests in
      # tests/test_photo_quality.py). Without it, the positive-case
      # tests skip cleanly via @pytest.mark.skipif — kept here so the
      # behavior tests run on every PR rather than only on the nightly.
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Test
        env:
          PULPO_OFFLINE: "1"
        run: pytest -q

      - name: Lint
        run: ruff check .

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # Static i18n guard — catches hardcoded English in JSX attribute
      # strings (`aria-label`, `placeholder`, `alt`, `title`) under
      # web/app/. ~1s, runs before the heavier checks. See
      # scripts/i18n_lint.mjs and CLAUDE.md → "i18n".
      - run: node scripts/i18n_lint.mjs
      - run: npm run test --if-present
      - run: npm run build

  # The e2e (Playwright smoke) job was REMOVED from PR-triggered CI on
  # 2026-05-25. Rationale: the suite spent more time red on PR pages
  # than green — selector drift across surfaces that evolved faster
  # than tests were maintained kept failing PRs that touched
  # completely unrelated code (e.g. backend ranker tweaks blocked by
  # broken homepage UI specs). The ~10-13 min runtime amplified the
  # friction. Pruning broken specs (#445) helped briefly but the
  # arms race wasn't sustainable for a small team.
  #
  # The tests themselves still live under `tests/e2e/` and the npm
  # script `e2e:smoke` still works locally:
  #
  #     npm run dev    # in one terminal
  #     npm run e2e:smoke
  #
  # Anyone investigating a UI regression can run them on demand. The
  # responsive-smoke spec specifically (the 5-viewport overflow guard)
  # remains the high-value sweep — run it before merging visual PRs.
  #
  # What remains as PR gates: pytest, frontend (typecheck + build),
  # contract, Vercel preview. The pulpo-nightly canary gates + the
  # manual Stripe-sandbox checklist in CLAUDE.md cover what CI can't
  # see (real Clerk, real Stripe).
  #
  # If we ever want the suite back, restore the job from git history
  # at this commit or move it to a nightly cron in a separate
  # workflow file so PRs aren't gated by it.
