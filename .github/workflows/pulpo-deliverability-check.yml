name: Pulpo email deliverability check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      # PRD P0-2 — Cloudflare 1010 blocks api.resend.com from the GH
      # runner. The provider call now happens on the Vercel cron at
      # /api/internal/webhook-health (same handler that backs the
      # stuck-invitation check). This poll keeps the weekly cadence as
      # an additional surface — the Vercel cron already runs every 6h.
      - name: Poll Vercel-cron webhook-health endpoint (Resend block)
        env:
          PULPO_HEALTH_URL: ${{ secrets.PULPO_HEALTH_URL }}
          PULPO_CRON_SECRET: ${{ secrets.PULPO_CRON_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/poll_webhook_health_endpoint.py
