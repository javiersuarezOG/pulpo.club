name: Pulpo email deliverability check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Check Resend deliverability recommendations
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PULPO_ACTIVATION_FROM_EMAIL: ${{ secrets.PULPO_ACTIVATION_FROM_EMAIL }}
          RESEND_FROM_NOREPLY: ${{ secrets.RESEND_FROM_NOREPLY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/check_email_deliverability_recommendations.py
