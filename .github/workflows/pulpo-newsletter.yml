name: pulpo newsletter

# Weekly Sunday cadence. Two modes:
#   • Scheduled cron: LIVE send to the Pro/Agency audience. Auto-resolves
#     the next issue number from PostHog, builds the per-recipient queue
#     from the Resend audience × Clerk users, calls Resend for real, fires
#     newsletter.send_succeeded/failed events. The PR-NL-9 Pro/Agency
#     audience gate is in force — free + anonymous subscribers are
#     filtered out. For a one-off launch broadcast to everyone, manually
#     dispatch with allow_all_subscribers=yes.
#   • Manual workflow_dispatch: dry-run by default for operator QA.
#     Override with send_mode=yes for a LIVE manual send, or
#     preview_cohorts=<email> for the admin-preview LIVE-to-one-address
#     path. only_email=<address> scopes a LIVE send to a single recipient
#     for smoke-testing.
#
# issue_number defaults to auto: when the operator leaves the input
# blank, the script queries PostHog for max(issue_number) from past
# successful sends and uses that + 1. Smoke (only_email) and preview
# (preview_cohorts) sends require an explicit number so a tester send
# can't bump production state.

on:
  schedule:
    - cron: "0 16 * * 0"    # every Sunday 16:00 UTC (10:00 SV — no DST)
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number (LEAVE BLANK to auto-increment from PostHog; required for preview / only_email runs)"
        required: false
        default: ""
      use_llm:
        description: "DeepSeek voice — 1 = on, 0 = deterministic (default)"
        required: false
        default: "0"
      send_mode:
        description: "Switch from dry-run to LIVE Resend send"
        required: false
        type: choice
        default: "no"
        options: ["no", "yes"]
      only_email:
        description: "Smoke-test address — limit the send to this one email. Blank = whole audience."
        required: false
        default: ""
      preview_cohorts:
        description: "Admin preview: send the 3 cohort variants (anonymous, free, pro) of the current issue to this email. Bypasses the audience queue + forces LIVE send. Blank = disabled."
        required: false
        default: ""
      preview_locale:
        description: "Locale for the preview render (only used when preview_cohorts is set)."
        required: false
        type: choice
        default: "en"
        options: ["en", "es"]
      allow_all_subscribers:
        description: "LAUNCH SEND — bypass the Pro/Agency gate; send to ALL audience contacts (anonymous, free, Pro). Default no."
        required: false
        type: choice
        default: "no"
        options: ["no", "yes"]

concurrency:
  # Admin PREVIEW test-sends (workflow_dispatch + preview_cohorts set) get
  # a UNIQUE per-run group, so firing several test-sends in quick
  # succession no longer cancels each other mid-run (the bug: two weekly
  # tests → one cancelled → only one email arrived). Everything else — the
  # real audience send, scheduled runs — shares one `…-audience` group with
  # cancel-in-progress, so two live blasts can never overlap.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.preview_cohorts != '')
        && format('pulpo-newsletter-preview-{0}', github.run_id)
        || 'pulpo-newsletter-audience' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.preview_cohorts != '') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # LLM toggle OFF by default — both the Sunday cron and the admin
      # preview button render with `deterministic_commentary` so the copy
      # matches the editorial template Sebas signed off on. Flip via
      # `workflow_dispatch use_llm=1` when iterating on the LLM voice.
      # Never burn DeepSeek credits from cron.
      PULPO_NEWSLETTER_USE_LLM: "${{ github.event.inputs.use_llm || '0' }}"

      # Send gate. The scheduled cron is LIVE — every Sunday 10:00 SV
      # the recipient queue is built and Resend is called for real.
      # Manual workflow_dispatch stays dry-run by default so an operator
      # can QA without sending; flip to LIVE per-dispatch by setting
      # send_mode=yes (or preview_cohorts=<email> for the admin-preview
      # LIVE-to-one-address path).
      PULPO_NEWSLETTER_DRY_RUN: "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.send_mode != 'yes' && github.event.inputs.preview_cohorts == '') && '1' || '0' }}"

      # Telemetry — silent no-op when secret is missing (per
      # automation/posthog_client.py + api/_posthog.js).
      POSTHOG_PROJECT_TOKEN: "${{ secrets.POSTHOG_PROJECT_TOKEN }}"
      POSTHOG_HOST: "${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}"
      DEEPSEEK_API_TOKEN: "${{ secrets.DEEPSEEK_API_TOKEN }}"
      # Read-side PostHog auth — used by automation/newsletter/issue_state.py
      # to query max(issue_number) from newsletter.send_succeeded events
      # when issue_number input is blank (auto-increment path). Missing
      # secrets degrade to default=1; the send still runs.
      POSTHOG_PROJECT_ID: "${{ secrets.POSTHOG_PROJECT_ID }}"
      POSTHOG_PERSONAL_API_KEY: "${{ secrets.POSTHOG_PERSONAL_API_KEY }}"

      # Send pipeline secrets. Missing-key paths return SendResult.error
      # — the script logs + PostHogs them, never crashes.
      RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
      RESEND_FROM_EMAIL: "${{ vars.RESEND_FROM_EMAIL }}"
      RESEND_AUDIENCE_ID: "${{ secrets.RESEND_AUDIENCE_ID }}"
      RESEND_REPLY_TO_EMAIL: "${{ vars.RESEND_REPLY_TO_EMAIL }}"
      PULPO_UNSUBSCRIBE_SECRET: "${{ secrets.PULPO_UNSUBSCRIBE_SECRET }}"
      PULPO_SITE_ROOT: "${{ vars.PULPO_SITE_ROOT || 'https://pulpo.club' }}"
      CLERK_SECRET_KEY: "${{ secrets.CLERK_SECRET_KEY }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # PostHog SDK + (optional) openai SDK for the LLM toggle path.
      - name: install runtime deps
        run: pip install -q posthog openai

      - name: assert ranked.json present
        run: |
          test -s web/data/ranked.json \
            || (echo "::error::web/data/ranked.json missing — run nightly first" && exit 1)

      # Skipped in preview-cohorts mode — the fixture is for the weekly
      # dry-run audit, not for the single-email operator preview.
      - name: build dry-run cohort fixtures
        if: github.event.inputs.preview_cohorts == ''
        run: |
          python3 scripts/build_newsletter_dryrun.py \
            --issue-number "${{ github.event.inputs.issue_number || '1' }}"

      - name: upload cohort fixture artifact
        if: github.event.inputs.preview_cohorts == ''
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-cohort-${{ github.run_id }}
          path: newsletter-drafts/dryrun-*.html
          retention-days: 30
          if-no-files-found: error

      - name: send issues
        # Three modes:
        #  • default cron — dry-run, audience-wide, fake message_ids;
        #  • workflow_dispatch + send_mode=yes — LIVE to the audience
        #    (optionally scoped by only_email);
        #  • workflow_dispatch + preview_cohorts=<email> — LIVE to that
        #    one address, three sends (anonymous, free_prefs, pro_prefs)
        #    so the operator can vet what each subscriber type receives.
        #
        # issue_number is passed ONLY when the operator provided one
        # (blank input → script auto-increments from PostHog). Smoke
        # / preview runs require an explicit value; the script exits
        # 2 if the input is blank in those modes.
        run: |
          ONLY_EMAIL="${{ github.event.inputs.only_email || '' }}"
          PREVIEW_EMAIL="${{ github.event.inputs.preview_cohorts || '' }}"
          PREVIEW_LOCALE="${{ github.event.inputs.preview_locale || 'en' }}"
          ISSUE_NUMBER="${{ github.event.inputs.issue_number || '' }}"
          ALLOW_ALL="${{ github.event.inputs.allow_all_subscribers || 'no' }}"
          ARGS=(--write-html-to newsletter-drafts/sent)
          if [ -n "$ISSUE_NUMBER" ]; then
            ARGS+=(--issue-number "$ISSUE_NUMBER")
          fi
          if [ -n "$PREVIEW_EMAIL" ]; then
            ARGS+=(--preview-cohorts "$PREVIEW_EMAIL" --preview-locale "$PREVIEW_LOCALE")
          elif [ -n "$ONLY_EMAIL" ]; then
            ARGS+=(--only-email "$ONLY_EMAIL")
          fi
          if [ "$ALLOW_ALL" = "yes" ]; then
            ARGS+=(--allow-all-subscribers)
          fi
          python3 scripts/send_newsletter.py "${ARGS[@]}"

      - name: upload sent artifact
        # The per-recipient rendered HTMLs (one file per send, named by the
        # recipient hash). Lets us audit any specific issue post-hoc.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-sent-${{ github.run_id }}
          path: newsletter-drafts/sent/*.html
          retention-days: 30
          if-no-files-found: ignore
