name: pulpo watchdog

# Runs 2 hours after the nightly (0 12 * * * UTC) so the pipeline has time
# to finish.
#
# Issue lifecycle — ONE ISSUE PER INCIDENT, not per day (post-2026-08-08):
#   * On failure, comment on the oldest OPEN watchdog issue if one exists;
#     only open a new one when there is no open incident. A continuing
#     freeze escalates on a single thread instead of minting a new issue
#     every 24h.
#   * On success, close every open watchdog issue with a resolution
#     comment. Recovery is the signal that the incident ended.
#
# Why: the previous logic deduped only within a calendar day and had no
# close path, so 75 issues accumulated between 2026-05-04 and 2026-08-08
# with zero ever closed. The 12-day July freeze alone produced 12
# separate issues. A permanently-red backlog is indistinguishable from
# no alerting at all — which is the exact failure mode the
# never-silent-freeze rule in CLAUDE.md exists to prevent. Slack remains
# the human-visible trip wire; the issue is the system of record.
#
# To silence temporarily: rename this file or set WATCHDOG_SKIP=1 as a
# repository variable. To trigger manually: gh workflow run pulpo-watchdog.yml
# To skip the public-deploy check (e.g. during DNS migration):
#   gh workflow run pulpo-watchdog.yml -f skip_deploy=true
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 08:00 El Salvador
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip the public-deploy reachability check (true/false)"
        required: false
        default: "false"

jobs:
  watchdog:
    name: Watchdog checks
    runs-on: ubuntu-latest
    if: ${{ vars.WATCHDOG_SKIP != '1' }}
    # Read repo contents + write issues
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchdog checks
        id: watchdog
        env:
          SKIP_DEPLOY: ${{ github.event.inputs.skip_deploy || 'false' }}
        run: |
          set +e
          ARGS=""
          if [ "$SKIP_DEPLOY" = "true" ]; then
            ARGS="--skip-deploy"
          fi
          python3 automation/watchdog.py $ARGS | tee /tmp/watchdog_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Capture output for issue body
          {
            echo "body<<WATCHDOG_EOF"
            cat /tmp/watchdog_output.txt
            echo "WATCHDOG_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Create or update GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_BODY: ${{ steps.watchdog.outputs.body }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TITLE="[watchdog] Pipeline check failed $TODAY"
          LABEL="watchdog"

          # Create the label if it doesn't exist
          gh label create "$LABEL" --color "e4e669" --description "Automated pipeline watchdog alert" 2>/dev/null || true

          # Escalate on the OPEN incident rather than opening one per day.
          # --limit 100 because the default page size is 30; without it a
          # large backlog could hide the open incident and mint a duplicate.
          # Oldest-first: a multi-day freeze keeps escalating on the thread
          # that recorded its first day.
          EXISTING=$(gh issue list \
            --label "$LABEL" \
            --state open \
            --limit 100 \
            --json number \
            --jq 'sort_by(.number) | .[0].number // empty')

          BODY=$(cat <<EOF
          ## Watchdog failure — $TODAY

          \`\`\`
          $WATCHDOG_BODY
          \`\`\`

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **To silence temporarily:** rename \`.github/workflows/pulpo-watchdog.yml\` via PR or set \`WATCHDOG_SKIP=1\` as a repo variable.
          **To re-run manually:** \`gh workflow run pulpo-watchdog.yml\`
          EOF
          )

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening new issue"
            gh issue create \
              --title "$TITLE" \
              --label "$LABEL" \
              --body "$BODY"
          fi

      - name: Slack alert on watchdog failure
        # The 2026-05-26 → 2026-06-01 6-day data freeze was invisible
        # for that long because the watchdog only opened GitHub Issues
        # — a surface nobody actively watches. The site served stale
        # data while a watchdog issue accumulated comments daily.
        #
        # Slack alerts on the same failure surface turn the silent
        # accumulation into a visible page. The existing GitHub issue
        # remains the system of record; this is the human-visible
        # trip wire. Best-effort: a Slack outage must not mask the
        # underlying watchdog failure.
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL unset; skipping watchdog Slack ping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # First line of the watchdog output usually carries the
          # leading FAIL reason — include it so the Slack ping is
          # actionable on its own without clicking through.
          REASON=$(grep -m1 -E '^FAIL ' /tmp/watchdog_output.txt 2>/dev/null || echo "see run")
          curl -sS -X POST -H 'Content-Type: application/json' \
            "$SLACK_WEBHOOK_URL" \
            -d "$(printf '{"text":"*Pulpo watchdog FAILED* — %s\\n<%s|view run>"}' "$REASON" "$RUN_URL")" \
            >/dev/null || echo "Slack POST failed (non-blocking)"

      - name: Close open watchdog issues on recovery
        # The close path the watchdog never had. Without it every failing
        # day left a permanent issue: 75 open, 0 closed, 2026-05-04 →
        # 2026-08-08. Recovery is the only reliable signal an incident
        # ended, so a green run resolves whatever is open.
        #
        # Best-effort by design (|| true): a GitHub API hiccup while
        # closing must never turn a HEALTHY pipeline run red. A missed
        # close self-heals on the next green run.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OPEN=$(gh issue list --label watchdog --state open --limit 100 \
                   --json number --jq '.[].number' || true)
          if [ -z "$OPEN" ]; then
            echo "No open watchdog issues; nothing to close."
            exit 0
          fi
          for N in $OPEN; do
            echo "Closing #$N (watchdog green)"
            gh issue close "$N" \
              --reason completed \
              --comment "✅ Watchdog green — all checks passed. Closing automatically.

          **Recovery run:** $RUN_URL" || echo "::warning::could not close #$N (non-blocking)"
          done
