name: pulpo watchdog

# Runs 2 hours after the nightly (0 12 * * * UTC) so the pipeline has time
# to finish. Opens a GitHub Issue on failure; comments on an existing open
# issue if one was already created today (suppresses duplicates).
#
# To silence temporarily: rename this file or set WATCHDOG_SKIP=1 as a
# repository variable. To trigger manually: gh workflow run pulpo-watchdog.yml
# To skip the public-deploy check (e.g. during DNS migration):
#   gh workflow run pulpo-watchdog.yml -f skip_deploy=true
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 08:00 El Salvador
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip the public-deploy reachability check (true/false)"
        required: false
        default: "false"

jobs:
  watchdog:
    name: Watchdog checks
    runs-on: ubuntu-latest
    if: ${{ vars.WATCHDOG_SKIP != '1' }}
    # Read repo contents + write issues
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchdog checks
        id: watchdog
        env:
          SKIP_DEPLOY: ${{ github.event.inputs.skip_deploy || 'false' }}
        run: |
          set +e
          ARGS=""
          if [ "$SKIP_DEPLOY" = "true" ]; then
            ARGS="--skip-deploy"
          fi
          python3 automation/watchdog.py $ARGS | tee /tmp/watchdog_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Capture output for issue body
          {
            echo "body<<WATCHDOG_EOF"
            cat /tmp/watchdog_output.txt
            echo "WATCHDOG_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Create or update GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_BODY: ${{ steps.watchdog.outputs.body }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TITLE="[watchdog] Pipeline check failed $TODAY"
          LABEL="watchdog"

          # Create the label if it doesn't exist
          gh label create "$LABEL" --color "e4e669" --description "Automated pipeline watchdog alert" 2>/dev/null || true

          # Check for an existing open issue with the same title today
          EXISTING=$(gh issue list \
            --label "$LABEL" \
            --state open \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" \
            | head -1)

          BODY=$(cat <<EOF
          ## Watchdog failure — $TODAY

          \`\`\`
          $WATCHDOG_BODY
          \`\`\`

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **To silence temporarily:** rename \`.github/workflows/pulpo-watchdog.yml\` via PR or set \`WATCHDOG_SKIP=1\` as a repo variable.
          **To re-run manually:** \`gh workflow run pulpo-watchdog.yml\`
          EOF
          )

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening new issue"
            gh issue create \
              --title "$TITLE" \
              --label "$LABEL" \
              --body "$BODY"
          fi

      - name: Slack alert on watchdog failure
        # The 2026-05-26 → 2026-06-01 6-day data freeze was invisible
        # for that long because the watchdog only opened GitHub Issues
        # — a surface nobody actively watches. The site served stale
        # data while a watchdog issue accumulated comments daily.
        #
        # Slack alerts on the same failure surface turn the silent
        # accumulation into a visible page. The existing GitHub issue
        # remains the system of record; this is the human-visible
        # trip wire. Best-effort: a Slack outage must not mask the
        # underlying watchdog failure.
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL unset; skipping watchdog Slack ping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # First line of the watchdog output usually carries the
          # leading FAIL reason — include it so the Slack ping is
          # actionable on its own without clicking through.
          REASON=$(grep -m1 -E '^FAIL ' /tmp/watchdog_output.txt 2>/dev/null || echo "see run")
          curl -sS -X POST -H 'Content-Type: application/json' \
            "$SLACK_WEBHOOK_URL" \
            -d "$(printf '{"text":"*Pulpo watchdog FAILED* — %s\\n<%s|view run>"}' "$REASON" "$RUN_URL")" \
            >/dev/null || echo "Slack POST failed (non-blocking)"
