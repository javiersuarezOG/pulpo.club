name: pulpo scraper auto-repair (shadow)

# Phase 4 — auto-repair workflow, v1 (shadow mode only).
#
# Triggered after a Pulpo nightly OR on manual dispatch. Reads the
# latest source_health_history.jsonl to find sources in red status,
# loads the matching diagnostic snapshot from web/data/scraper_failures/,
# asks Claude to propose a patch via scripts/scraper_autorepair.py,
# and (in SHADOW mode) posts the suggestion as a comment on the
# existing watchdog issue for that source.
#
# Shadow mode is deliberate. The cost of a wrong auto-merged scraper
# patch is bigger than the cost of waiting for a human review. After
# ~4 weeks of useful shadow suggestions we'll graduate to ACTIVE mode
# (apply patch, run offline test, open PR if validated) — that lives
# in a separate follow-up PR with stricter safety rails.
#
# Why workflow_run.completed (not workflow_run.failed)?
# A nightly that "succeeds" can still have a red source (the canary
# gates are best-effort, not perfect). Reading source_health_history
# inside the script is more authoritative than the workflow's
# conclusion field.

on:
  workflow_run:
    workflows: ["pulpo nightly run"]
    types: [completed]
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated source slugs (empty = auto-detect red sources)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Skip Anthropic call, print prompt only"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: pulpo-scraper-autorepair
  cancel-in-progress: false   # don't kill in-flight repair if a new nightly fires

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Shadow mode only needs to comment on the watchdog issue.
      # contents:write + pull-requests:write get added in the
      # graduation PR alongside the active-mode script changes —
      # principle of least privilege over upfront convenience.
      issues: write
      # Required by actions/download-artifact@v4 to fetch the
      # nightly-diagnostics-* artifact across workflow boundaries.
      actions: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Anthropic SDK — pinned to a tested major. Pulpo doesn't use
          # this elsewhere yet, so we install it in this workflow only.
          pip install 'anthropic>=0.40,<1.0'

      - name: Download nightly diagnostics artifact
        # Only runs on the `workflow_run` trigger (when this job was
        # fired by a completed pulpo-nightly). Pulls the fresh
        # source_health_history.jsonl + scraper_failures/ from the
        # triggering nightly — including rows from a canary-blocked
        # run that never reached main. On manual dispatch + on any
        # download failure we fall through to committed main via
        # AUTOREPAIR_DATA_DIR being unset (see scraper_autorepair.py
        # _resolve_data_dir).
        if: github.event_name == 'workflow_run'
        id: artifact
        uses: actions/download-artifact@v4
        with:
          name: nightly-diagnostics-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/nightly-diagnostics
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          # Don't fail the whole job if the artifact isn't there (older
          # nightly runs predate the upload step; the script's fallback
          # to committed main keeps autorepair useful for those).
          if-no-files-found: warn
        continue-on-error: true

      - name: Run auto-repair (shadow mode)
        env:
          # Anthropic key. Tries both names because the repo secret was
          # named PULPO_CLUB_SCRAPER_AUTOREPAIR during initial provisioning;
          # ANTHROPIC_API_KEY is the canonical name a future maintainer
          # would expect. Either works.
          ANTHROPIC_API_KEY: ${{ secrets.PULPO_CLUB_SCRAPER_AUTOREPAIR || secrets.ANTHROPIC_API_KEY }}
          # gh CLI auth for the `gh issue comment` post step. Must be
          # the auto-provisioned github.token — the workflow's
          # `permissions: { issues: write }` block applies to that token
          # specifically. PULPO_BOT_TOKEN is a fine-grained PAT scoped
          # for the nightly's git-push flow and lacks `issues: write`,
          # which surfaced as `gh issue comment ... non-zero exit status 1`
          # in run 26368507241.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOREPAIR_MODE: "shadow"
          AUTOREPAIR_MODEL: ${{ vars.AUTOREPAIR_MODEL || 'claude-opus-4-7' }}
          AUTOREPAIR_TARGETS: ${{ github.event.inputs.targets || '' }}
          AUTOREPAIR_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          # When the artifact download succeeded, point the script at
          # the unpacked diagnostics dir; otherwise unset → script falls
          # back to web/data on committed main.
          AUTOREPAIR_DATA_DIR: ${{ steps.artifact.outcome == 'success' && format('{0}/nightly-diagnostics', runner.temp) || '' }}
        run: |
          python3 scripts/scraper_autorepair.py
