name: pulpo nightly run

# Every night at 02:00 UTC. Pulled forward from 12:00 UTC so the pipeline
# completes before 8am Europe/Madrid year-round:
#   02:00 UTC = 04:00 CEST (summer) = 03:00 CET (winter).
# Typical run is 50–70 min → data PR + Vercel deploy land by ~03:30 UTC =
# 05:30 CEST / 04:30 CET. Watchdog at 05:00 UTC (+3h offset) still leads
# 8am Madrid by ≥3h.
# 20:00 El Salvador local — bot push runs while ES sleeps.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}    # also allow manual runs

# Single-flight: a manual trigger or a backed-up cron must not race a
# still-running nightly — both would try to PR-merge dated data branches and
# the second commit would lose. cancel-in-progress kills the older run.
concurrency:
  group: pulpo-nightly
  cancel-in-progress: true

# Count canaries — both fail the workflow without committing stale data.
# FLOOR: raise if clean baseline grows. CEILING: raise if ceiling is hit
# legitimately (new large source added). The asymmetry catches both supply
# collapse (broken scraper) and phantom inflation (parser bug, dedup failure).
# Baseline after Phase 1+2 cleanup: ~740 listings.
env:
  # Floor: catches scraper collapse (silent zero-yield from a source
  # going down). Set ~80% of the post-encuentra24 expected baseline.
  # Ceiling: catches runaway parser bugs (deduplication failure, etc.).
  # Bumped 2026-05-08 to fit encuentra24's first capped run (PULPO_E24_LIMIT=200
  # adds ~200 listings on top of the existing ~895 → ~1095). Lift the
  # ceiling further when we lift the encuentra24 cap.
  # Phase-C bedding-in override (REMOVE 2026-06-13 after 7 green
  # post-Phase-C nightlies, or sooner once R2 guard classification lands).
  # Run 27050642483 produced 1913 valid post-purge listings; the old 1300
  # ceiling treated legitimate source expansion as parser inflation.
  LISTING_COUNT_FLOOR: "1000"
  LISTING_COUNT_CEILING: "3500"
  # PR-MC-5 — multi-country prep. The pipeline today runs SV-only;
  # PULPO_ACTIVE_COUNTRY tells the FE + the per-country reference data
  # which country to render. PULPO_COUNTRIES is a comma-separated list
  # for the (future) matrix nightly that will produce per-country
  # outputs for multiple deployments from one cron run. Today both
  # default to "SV" and the workflow behaves identically.
  PULPO_ACTIVE_COUNTRY: "SV"
  PULPO_COUNTRIES:      "SV"
  # Per-country canary floor/ceiling override the global LISTING_COUNT_*
  # values above when the active country has a tighter band in its
  # manifest. PR-MC-1b put SV's bounds in pulpo/countries/sv.json under
  # listing_count_floor / listing_count_ceiling; the canary-check step
  # later in this workflow prefers those when set. Adding a country =
  # set country_count_floor / country_count_ceiling in its <cc>.json.
  #
  # PR-S4c — activate the ranker's stale-listing filter. Listings whose
  # existence-ledger state (web/data/listings_ledger.json, populated
  # by automation/run.py via PR-S4b) is "stale" are dropped before
  # ranking. "Stale" requires missing for >=STALE_THRESHOLD_RUNS=3
  # consecutive nightlies AND the source must have succeeded each of
  # those nightlies (a scraper-failure absence is NOT counted as
  # missing). So this flag is effectively a no-op for the first ~3
  # nightlies after PR-S4b lands, then auto-activates as the ledger
  # accumulates state. The OFF branch still emits a
  # `[ranker_stale_filter] stale_candidates=N would_drop_if_flag_on`
  # telemetry line, so flipping back is straightforward if N is ever
  # larger than expected. To deactivate: comment this line out or
  # set to "0".
  PULPO_RANKER_DROP_STALE: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    # Hard ceiling. A healthy run finishes in ~30 min; the LLM enrichment
    # leg can stretch to ~50 min on cold-cache nightlies (~900 listings ×
    # ~3.5s/call serial DeepSeek). Past the ceiling something is genuinely
    # hung (typically photo download or detail-page fetch); better to fail
    # the job and have watchdog page than burn Actions minutes silently.
    #
    # 2026-06-05 (PR-S0): bumped 120 → 180 after a multi-day silent freeze
    # (2026-06-02 → 2026-06-05). The 120 ceiling was firing AFTER SV
    # pipeline (~110 min with encuent24 Playwright + LLM enrichment) and
    # DURING PA pipeline, cancelling downstream canaries + commit step.
    # Cancellation is NOT `failure()`, so the Slack-on-failure step did not
    # fire (CLAUDE.md post-2026-06-02 rule was bypassed). Adding 60 min of
    # buffer for PA + canaries + commit; the watchdog still pages if a
    # single nightly genuinely runs over 24h. Paired with the
    # `if: failure() || cancelled()` change on the Slack step below so the
    # next timeout-driven cancellation pages Sebas instead of silently
    # freezing the data.
    #
    # 2026-06-06 bump 180 → 240: post-Phase-C nightly (run 27045998651)
    # showed SV crawl alone takes ≈180 min once the 6 new working sources
    # (xitios, santizo, citymax_sc, vivolatam, csbr, realestate_au_sv)
    # are walking detail pages at the polite 0.5 rps default. SV finished
    # cleanly at the timeout boundary, but the run cancelled before PA +
    # canaries + commit could fire — 800+ fresh listings landed in the
    # runner working tree and nowhere else. 240 min restores the
    # 60-min PA+canary+commit+deploy budget the prior bump targeted,
    # measured from the new (slower) SV duration. If the next post-bump
    # nightly still cancels, the next move is per-source rate-limit
    # tuning, not another timeout bump.
    timeout-minutes: 240
    permissions:
      contents: write       # commit refreshed web/data/ back
      pull-requests: write  # gh pr create — main is PR-protected (#29's flow)
      # The fallback `gh workflow run ci.yml --ref BRANCH` step (added in
      # PR #69 to unblock the recurring 'pytest Expected' lockout) needs
      # this. Without it the dispatch returns HTTP 403 'Resource not
      # accessible by integration' and the data PR sits forever waiting
      # on required checks that never report.
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # Use PAT so the bot push can write to main without a PR.
          # PULPO_BOT_TOKEN: fine-grained PAT, Contents: write on this repo.
          # Falls back to GITHUB_TOKEN (works since branch protection no longer
          # requires a PR on main).
          token: ${{ secrets.PULPO_BOT_TOKEN || github.token }}

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      # System binary for pytesseract (text-overlay detection in
      # automation/photo_quality.py). When absent, the detector returns
      # None and the elite featured-listing filter falls back to
      # "not flagged" — runs cleanly but without OCR exclusion.
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Headless Chromium for the encuentra24 scraper (PR #187 added the
      # parser; this step adds the browser so the live crawl can run).
      # `--with-deps` installs system shared libraries (apt) needed by
      # Chromium on Ubuntu 24.04. Cold install is ~60s; we don't bother
      # caching the browser binary because nightly is once-a-day and the
      # cache invalidation rules around playwright versions create more
      # debugging surface than the saved seconds are worth.
      - name: Install Playwright + Chromium (encuentra24 scraper)
        run: |
          pip install playwright==1.49.1
          playwright install chromium --with-deps

      - name: Run pipeline
        env:
          PULPO_OFFLINE: "0"
          PULPO_LIMIT: "1000"
          # Disabled sources (re-add when the blocker is resolved):
          #   kazu              — Nuxt SPA, panel API denylisted; needs headless browser
          #
          # realtyelsalvador  — trial re-enabled 2026-05-20 (PR #346). It was
          #   disabled 2026-05-06 after 3 consecutive 403s from Azure runner
          #   IPs (PR #67's header workaround stopped working). Two weeks later
          #   the WP REST endpoint still serves ~179 listings from a local IP,
          #   and Cloudflare bot rules drift, so we're trialling a re-enable
          #   before investing in an HTML rewrite or a residential proxy. The
          #   source_health row from the next nightly will tell us:
          #     • green / count>0  → WAF softened, leave it on
          #     • red / count=0    → still blocked, revert this PR and pursue
          #                          the HTML-page or proxy path
          #   With PR #344's staleness guard landed, a single failed nightly
          #   no longer spams the issue tracker.
          #
          # PULPO_SOURCES is an OPTIONAL explicit-override. When unset
          # the nightly autodiscovers every scraper in pulpo/scrapers/
          # via the package's __init__ side effect — drop a new file,
          # next nightly crawls it, no workflow edit needed. See
          # automation/run.py around the PULPO_SOURCES read for the
          # fallback logic, and pulpo/scrapers/__init__.py for the
          # autodiscovery loop. Set this env var only when you need to
          # crawl a *subset* (debugging a single source, or temporarily
          # disabling a noisy one) — leaving it unset is the normal path.
          #
          # Example temporary disable while investigating a red source:
          #   PULPO_SOURCES: "goodlife,oceanside,century21,bienesraices,remax,nexo,encuentra24"
          # (omits realtyelsalvador for one nightly)
          #
          # encuentra24 added 2026-05-08 (PR-E2 follow-up to PR #187).
          # Phase 3 (2026-05-24) widened the funnel from 3 to 18 category
          # URLs (per-department subpaths) and lifted PULPO_E24_LIMIT
          # from 200 to 2000 — see comment on PULPO_E24_LIMIT below.
          # encuentra24-specific cap. Tightens against PULPO_LIMIT (the
          # global cap) but never raises it. Set high enough that real
          # nightly yield is bounded by inventory + vacation-zone filter
          # rather than by this ceiling.
          PULPO_E24_LIMIT: "2000"
          # Hero-photo wall budget (Phase A download + Phase C derivative
          # write inside automation/run.py::_download_hero_photos). The
          # default 600s was too small for the post-encuentra24 baseline:
          # 2026-05-19 nightly run #26079587684 burned 600s in Phase A on
          # 237 fresh downloads and Phase C wrote zero heroes — leaving
          # hero_photo_path=null for ALL 917 listings in ranked.json and
          # collapsing api/social/listings to an empty response.
          # 1800s (30 min) gives Phase A + C room to complete on a cold
          # cache (~720 listings at ~2.5s each = ~30 min). Subsequent
          # nightlies hit the URL-hash skip path and finish in seconds.
          #
          # 2026-06-06 bump 1800 → 3600: post-Phase-C nightly run
          # 27050642483 attempted 766 cold downloads (8 new sources
          # adding fresh photo URLs) and burned the full 1800s without
          # completing ANY (0/766 ok). Doubling the budget gives the
          # cold cache room to populate; subsequent nightlies collapse
          # to seconds once URL-hash skip takes over. If this bump
          # alone isn't enough, follow-up investigation needed on
          # whether a single slow source-domain is stalling the
          # downloader.
          PULPO_PHOTO_BUDGET_S: "3600"
          # 2026-06-06 ride-along: allow the population-regression
          # guard to log-and-pass while the 6 new working Phase C
          # sources (mostly land — csbr fincas, realestate_au_sv
          # rural-land, etc) establish their own baseline. Run
          # 27050642483 hard-failed on is_motivated 15.3% → 8.1% and
          # six other field drops, all driven by the denominator
          # growing from ~1300 → 2107 listings while NUMERATOR
          # signals (house-text "motivated seller", beachfront tier,
          # land_type_commercial) didn't grow proportionally. This
          # is the exact case the guard's own comment calls out
          # ("use sparingly — set when adding new sources shifts the
          # population mix"). Once the 6 new sources have ~7
          # nightlies of baseline, this line REMOVES — the guard
          # goes back to catching real NLP/keyword regressions.
          PULPO_ALLOW_POPULATION_REGRESSION: "1"
          # PRD §FR-6 AI enrichment. The single-call DeepSeek flow (PRs
          # #79-81) reads DEEPSEEK_API_TOKEN. When unset, llm_enrichment
          # graceful-skips and listings get fallback templates only —
          # full pipeline still runs.
          # Provision via: gh secret set DEEPSEEK_API_TOKEN
          DEEPSEEK_API_TOKEN: ${{ secrets.DEEPSEEK_API_TOKEN }}
          # Bounded concurrency for the LLM enrichment fan-out. 8 in-flight
          # DeepSeek calls keeps us comfortably under their published rate
          # limit while collapsing what was a ~50-min serial loop into ~5-7
          # min. Run 25456987618 (2026-05-06) hit the 60-min wall mid-loop
          # because of the previous serial fan-out.
          PULPO_LLM_CONCURRENCY: "8"
          # Soft-fail deadline for enrichment (seconds from start of the
          # enrichment leg). Leaves ~30 min of budget for everything that
          # comes after enrichment (fallback templates, photo download,
          # write JSON, commit + PR). Past the deadline, no NEW DeepSeek
          # calls go out — in-flight ones complete; deferred listings get
          # picked up next nightly via the sidecar cache. The pipeline
          # ALWAYS ships rather than dying inside the LLM loop.
          PULPO_LLM_DEADLINE_SECONDS: "5400"   # 90 min
          # PostHog server-side telemetry — feeds the Analytics-basics
          # dashboard (pipeline_started/completed, crawl_succeeded/failed,
          # llm_enrichment_completed, regression_guard_triggered). Same
          # `phc_...` project key as the frontend (it's the ingest write
          # key, safe to reuse server-side). When the secret is unset the
          # pipeline runs unchanged — automation/posthog_client.py
          # silent-no-ops.
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
          # ── Plan v2 — parallel hi-res photo pipeline ──────────────
          # ENABLED for ongoing nightlies (2026-05-19). All 7 sources
          # are in scope; goodlife + encuentra24 use per-source URL
          # rewrites from automation/hires_url_transform.py, the other
          # five run with identity transforms and rely on the
          # hires_eligible ≥1080×1080 gate to reject sources whose
          # URLs aren't actually native resolution. The first-run
          # per-source coverage in hires_pipeline_metrics.jsonl tells
          # us which sources need a transform added.
          PULPO_HIRES_ENABLED: "1"
          PULPO_HIRES_SOURCES: "bienesraices,century21,encuentra24,goodlife,nexo,oceanside,remax"
          PULPO_HIRES_BUDGET_S: "5400"   # 90 min wall budget; cold first run ~60 min
          PULPO_HIRES_LIMIT: "0"          # process every listing in scope
          PULPO_HIRES_SHADOW: "0"         # informational only — not gated on serve
          # api/social/image.js gate. When set to "0", the endpoint
          # ignores .hires.jpg files even if they exist on disk —
          # operator-controlled cutover from shadow → live. Set to "1"
          # so /api/social/image's Tier-1 hires path actually serves
          # the new derivatives. Quarantined files (resdet upscale
          # fraud) still fall back to hero automatically.
          PULPO_HIRES_SERVE: "1"
          # Phase 4 U3 — LLM-vision aesthetic booster. Default ON via
          # the `|| 'true'` fallback so the picker always tries to
          # blend aesthetic + technical scores. When no provider key
          # (QWEN_API_KEY / SEGMIND_API_KEY / OPENAI_API_KEY /
          # ANTHROPIC_API_KEY) is configured, score_aesthetic returns
          # None and the picker silently falls back to technical-only
          # — pipeline runs unchanged. Set repo secret
          # LLM_VISION_ENABLED=false to force-disable. Daily budget
          # cap defaults to $1.00 (automation/aesthetic_vision.py);
          # top-X% gating defaults to 5 — see .env.example.
          LLM_VISION_ENABLED: ${{ secrets.LLM_VISION_ENABLED || 'true' }}
          LLM_VISION_PROVIDER: ${{ secrets.LLM_VISION_PROVIDER }}
          LLM_VISION_DAILY_BUDGET_USD: ${{ secrets.LLM_VISION_DAILY_BUDGET_USD }}
          LLM_VISION_TOP_PCT: ${{ secrets.LLM_VISION_TOP_PCT }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
        run: python automation/run.py

      # PR-MC-PA-3 — first non-SV nightly run. PA inventory is small
      # (~4-30 listings/run today; SV is ~900), so a separate pipeline
      # invocation rather than a matrix. The pipeline dual-writes the
      # legacy `ranked.json` filename alongside the per-country one;
      # because the apex (pulpo.club) reads `ranked.json` and serves
      # SV, we back up SV's legacy files before the PA run and restore
      # them after. PA outputs land at `ranked.PA.json` etc. and feed
      # the future pa.pulpo.club deploy (deploy infra not yet wired —
      # see DEPLOY.md "Adding a country (subdomain rollout)" section).
      #
      # `continue-on-error: true` because PA is brand-new — its
      # population-rate baseline is non-existent and the scraper is
      # still calibrating. A bad PA run must NOT block the SV commit.
      - name: Run PA pipeline (multi-country scaffolding)
        continue-on-error: true
        env:
          PULPO_OFFLINE: "0"
          PULPO_ACTIVE_COUNTRY: "PA"
          PULPO_E24_COUNTRY: "PA"
          PULPO_E24_COUNTRY_SLUG: "panama-es"
          PULPO_SOURCES: "encuentra24"
          # PA cap below SV's (SV runs PULPO_LIMIT=1000 above) — PA
          # inventory is much smaller and the cap stops a runaway from
          # consuming the runner's time budget.
          PULPO_LIMIT: "300"
          PULPO_E24_LIMIT: "300"
          # PA has no population-rate history yet. The regression guard
          # would always fire (100% drop on every field) until PA has
          # ~7 nightlies of baseline. Override for now; remove once
          # PA stabilises.
          PULPO_ALLOW_POPULATION_REGRESSION: "1"
          DEEPSEEK_API_TOKEN: ${{ secrets.DEEPSEEK_API_TOKEN }}
          LLM_VISION_ENABLED: ${{ secrets.LLM_VISION_ENABLED || 'true' }}
          LLM_VISION_PROVIDER: ${{ secrets.LLM_VISION_PROVIDER }}
          LLM_VISION_DAILY_BUDGET_USD: ${{ secrets.LLM_VISION_DAILY_BUDGET_USD }}
          LLM_VISION_TOP_PCT: ${{ secrets.LLM_VISION_TOP_PCT }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
        run: |
          # Snapshot SV's legacy files; the PA run will dual-write them.
          mkdir -p /tmp/sv-legacy
          for f in ranked.json ranked.list.json last_updated.json featured.json; do
            [ -f "web/data/$f" ] && cp "web/data/$f" "/tmp/sv-legacy/$f"
          done

          python automation/run.py || echo "PA pipeline exited non-zero (continue-on-error)"

          # Restore SV's legacy files so the apex (pulpo.club) keeps
          # serving SV data. PA-specific outputs (`ranked.PA.json` etc.)
          # are untouched by this restore.
          for f in ranked.json ranked.list.json last_updated.json featured.json; do
            [ -f "/tmp/sv-legacy/$f" ] && cp "/tmp/sv-legacy/$f" "web/data/$f"
          done

      - name: Source-health Slack alert (pre-canary)
        # Pulpo's scheduled watchdog (pulpo-watchdog.yml) reads
        # source_health_history.jsonl from `main`. The data PR commit
        # only lands AFTER the canaries pass; when a canary fails (the
        # exact mode that froze ranked.json 2026-05-27 → 2026-05-31)
        # today's red rows never reach main and the watchdog can't
        # see them. Reading the working tree here closes that blind
        # spot and posts a Slack message naming the red source(s).
        # Best-effort: alerting failures never block the deploy path.
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 scripts/check_source_health.py \
            --data-dir web/data \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::source-health alert script failed (non-blocking)"

      - name: Stranded-inventory alert (R6)
        # R6 of docs/RESILIENCE-AUDIT-PRD.md. Reads R1's candidate
        # bundle at web/data/.staging/<run_id>/ and fires Slack + opens
        # a persistent GitHub Issue iff visible_count > 0 AND
        # promotion did not happen this run (canonical last_updated.json
        # is older than / missing relative to the candidate). Always
        # exits 0 — alerting must not block the workflow. Runs at the
        # same pre-canary point as the source-health alert so an
        # operator paged at 02:30 UTC can correlate the two signals
        # against a single Actions run.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 scripts/check_stranded_inventory.py \
            --data-dir web/data \
            --run-id "${{ github.run_id }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact-hint "candidate_bundle_${{ github.run_id }} (Artifacts tab on the Actions run)" \
            || echo "::warning::stranded-inventory alert script failed (non-blocking)"

      - name: PA count canary (soft — logs only, never fails)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open("web/data/ranked.PA.json"))
              n = len(data)
              print(f"PA canary: {n} listings (informational)")
              if n == 0:
                  print("WARN: PA scrape produced 0 listings", file=sys.stderr)
          except FileNotFoundError:
              print("WARN: ranked.PA.json not written; "
                    "PA pipeline likely failed", file=sys.stderr)
          EOF

      - name: Count canary (floor + ceiling)
        env:
          PULPO_ACTIVE_COUNTRY: ${{ env.PULPO_ACTIVE_COUNTRY }}
        run: |
          python3 - <<'EOF'
          import json, sys, os
          # PR-MC-5 — prefer the per-country floor/ceiling from the
          # active country's manifest. Falls back to the workflow-level
          # LISTING_COUNT_FLOOR / LISTING_COUNT_CEILING env vars when
          # the manifest doesn't carry them (legacy default).
          try:
              from pulpo.countries import active as _active
              m = _active().raw
              manifest_floor   = m.get("listing_count_floor")
              manifest_ceiling = m.get("listing_count_ceiling")
          except Exception as e:
              print(f"WARN: could not load country manifest, "
                    f"using env-var defaults: {e}", file=sys.stderr)
              manifest_floor = manifest_ceiling = None

          floor   = int(manifest_floor   if manifest_floor   is not None
                        else os.environ.get("LISTING_COUNT_FLOOR",   "600"))
          ceiling = int(manifest_ceiling if manifest_ceiling is not None
                        else os.environ.get("LISTING_COUNT_CEILING", "900"))
          try:
              data = json.load(open("web/data/ranked.json"))
          except Exception as e:
              print(f"ERROR: could not read ranked.json: {e}", file=sys.stderr)
              sys.exit(1)
          n = len(data)
          cc = os.environ.get("PULPO_ACTIVE_COUNTRY", "SV")
          if n < floor:
              print(f"CANARY FAIL [{cc}]: {n} listings < floor {floor}. "
                    "Not committing — stale data kept.", file=sys.stderr)
              sys.exit(1)
          if n > ceiling:
              print(f"CANARY FAIL [{cc}]: {n} listings > ceiling {ceiling}. "
                    "Possible parser inflation — not committing.", file=sys.stderr)
              sys.exit(1)
          print(f"CANARY OK [{cc}]: {n} listings in [{floor}, {ceiling}]")
          EOF

      - name: Per-type canaries (floor + classification confidence)
        # Per-type ingestion floors + classifier-confidence guard. Catches:
        #   - house/condo coverage collapsing below acceptable minimum
        #     (e.g. a scraper broadening regression silently drops built listings)
        #   - classifier going haywire and tagging the majority of listings
        #     "uncertain" (signal that broker fields or text patterns shifted)
        #
        # Phase-C bedding-in: temporarily log-only while source mix and
        # per-type baselines settle after the June 2026 source expansion.
        # REMOVE 2026-06-13 after 7 green post-Phase-C nightlies, or sooner
        # once R2 guard classification lands.
        #
        # ENFORCING (PR-5 of the reliability plan). The 7-day soak window from
        # the PRD calibration period (2026-05-06 → 2026-05-13) is over and
        # observed counts have been stable, so violations now fail the
        # workflow instead of logging. Floors are calibrated to ~85% of the
        # post-#418 equilibrium (the agricultural-purge scope-tightening,
        # merged 2026-05-22, dropped ~35 houses that were ALSO flagged as
        # `is_agricultural`, taking the post-purge house count to ~34).
        # Ceiling on uncertain rate stays at 15% per the original PRD spec.
        # Set LOG_ONLY="true" to temporarily downgrade to log-only while
        # recalibrating thresholds — mirrors the data-quality canary's escape
        # hatch.
        env:
          LOG_ONLY:        "true"
          HOUSE_FLOOR:     "30"   # ~85% of post-#418 equilibrium (~34)
          CONDO_FLOOR:     "5"    # ~60% of 8 (small N — looser tolerance)
          UNCERTAIN_PCT_CEILING: "15"
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from collections import Counter

          log_only = os.environ.get("LOG_ONLY", "false").lower() == "true"
          floors = {
              "house": int(os.environ.get("HOUSE_FLOOR",  "30")),
              "condo": int(os.environ.get("CONDO_FLOOR",  "5")),
          }
          uncertain_ceiling = float(os.environ.get("UNCERTAIN_PCT_CEILING", "15"))
          violations: list[str] = []

          # ── Per-type floor canary ──────────────────────────────────────
          try:
              data = json.load(open("web/data/ranked.json"))
          except Exception as e:
              print(f"ERROR: could not read ranked.json: {e}", file=sys.stderr)
              sys.exit(1)
          counts = Counter(li.get("property_type") for li in data)
          for pt, floor in floors.items():
              n = counts.get(pt, 0)
              if n < floor:
                  violations.append(
                      f"PER_TYPE_FLOOR: {pt}={n} < floor {floor} "
                      f"(scraper broadening may have regressed)"
                  )
              else:
                  print(f"  {pt:6s} {n:>4} ≥ floor {floor}")

          # ── Classifier confidence canary ───────────────────────────────
          # Reads type_classifier_log.jsonl, looks at the LAST run's rows
          # (highest ts), counts uncertain%. >ceiling means the classifier
          # is no longer confident — could be broker-side field changes,
          # weak text signals on a newly-broadened scraper, etc.
          try:
              rows = []
              with open("web/data/type_classifier_log.jsonl") as f:
                  for ln in f:
                      ln = ln.strip()
                      if ln and not ln.startswith("#"):
                          rows.append(json.loads(ln))
              if rows:
                  latest_ts = max(r["ts"] for r in rows)
                  latest = [r for r in rows if r["ts"] == latest_ts]
                  unc = sum(1 for r in latest if r.get("confidence") == "uncertain")
                  pct = (100.0 * unc) / len(latest) if latest else 0.0
                  if pct > uncertain_ceiling:
                      violations.append(
                          f"CLASSIFIER_UNCERTAIN: {pct:.1f}% > ceiling {uncertain_ceiling}% "
                          f"({unc}/{len(latest)} listings — text signals weakened?)"
                      )
                  else:
                      print(f"  classifier_uncertain {pct:.1f}% ≤ ceiling {uncertain_ceiling}%")
          except FileNotFoundError:
              print("  classifier log not found — skipping confidence canary")
          except Exception as e:
              print(f"  classifier log read error: {e}")

          if violations:
              label = "CANARY LOG" if log_only else "CANARY FAIL"
              for v in violations:
                  print(f"{label}: {v}", file=sys.stderr)
              if not log_only:
                  sys.exit(1)
          else:
              print("Per-type canaries: all OK")
          EOF

      - name: Data-quality canaries
        # Enforcing: violations fail the workflow. Set LOG_ONLY="true" to
        # temporarily downgrade to log-only while recalibrating thresholds.
        #
        # Repo variable escape hatch (PR-NR-H, 2026-06-02): when a real
        # listing trips a canary that you trust the underlying validation
        # layer to handle correctly (today's case: a $7666/m² premium
        # beachfront micro-lot at Jaltepeque tripped PPM_RANGE on
        # nightly 26774794593), set the repo variable
        # `DATA_QUALITY_LOG_ONLY=true` via Settings → Variables → Actions
        # and the next nightly ships without a code change. Flip back to
        # `false` once the canary threshold is properly recalibrated in
        # a follow-up PR — leaving log-only forever is how silent data
        # corruption ships. The default below is `false` (enforce), so
        # the canary continues to gate fresh data unless explicitly
        # disabled.
        env:
          LOG_ONLY: ${{ vars.DATA_QUALITY_LOG_ONLY || 'false' }}
        run: |
          python3 - <<'EOF'
          import json, re, sys, os

          log_only = os.environ.get("LOG_ONLY", "true").lower() == "true"
          fail     = False

          try:
              data = json.load(open("web/data/ranked.json"))
          except Exception as e:
              print(f"ERROR: could not read ranked.json: {e}", file=sys.stderr)
              sys.exit(1)

          NON_SV_TITLE_RE = re.compile(
              r'(?:^(?:\w+\s+){0,4}|,\s*(?:en|in)\s+)'
              r'(guatemala|honduras|costa.?rica|nicaragua|panam[aá]|m[eé]xico|colombia)\b',
              re.IGNORECASE,
          )

          violations = []
          for r in data:
              url   = r.get("url") or ""
              title = r.get("title") or ""
              price = r.get("price_usd")
              area  = r.get("area_m2")
              ppm   = r.get("price_per_m2")

              # Country canary
              if NON_SV_TITLE_RE.search(title):
                  violations.append(f"COUNTRY: {title!r} (url={url})")

              # Area canary — 15M m² ≈ 1500 ha covers the biggest real fincas
              # we've seen; absurd values (unit-conversion slip) still trip.
              if area is not None and area > 15_000_000:
                  violations.append(f"MAX_AREA: area_m2={area} title={title!r}")

              # Price canary
              if price is not None and price > 50_000_000:
                  violations.append(f"MAX_PRICE: price_usd={price} title={title!r}")

              # $/m² range canary — agricultural land (>5 ha) trades far
              # lower than urban lots, so lower the floor for that cohort.
              # Ceiling 10_000 matches automation/validation_bounds.PPM_DROP_MAX
              # so this canary fires on the same range the validation layer
              # drops as structurally broken (unit-conversion bugs). Premium
              # SV beachfront micro-lots can legitimately price between 5k
              # and 10k USD/m² — those are FLAG'd by validation (kept with a
              # warning), so failing the nightly on them blocks fresh data
              # for genuinely correct listings (e.g. 2026-06-01 nightly
              # 26774794593 failed on bienesraices "Rancho de playa - Frente
              # al estero Jaltepeque" at 7666 USD/m²).
              ptype = (r.get("property_type") or "").lower()
              is_agri = ptype == "land" and area is not None and area > 50_000
              ppm_floor = 0.10 if is_agri else 1.0
              if ppm is not None and ppm > 0 and (ppm < ppm_floor or ppm > 10_000):
                  violations.append(f"PPM_RANGE: price_per_m2={ppm} title={title!r}")

          if violations:
              label = "CANARY LOG" if log_only else "CANARY FAIL"
              for v in violations:
                  print(f"{label}: {v}", file=sys.stderr)
              if not log_only:
                  fail = True

          if violations:
              print(f"Data-quality canaries: {len(violations)} violations "
                    f"({'logged only' if log_only else 'FAILING'})")
          else:
              print("Data-quality canaries: all OK")

          sys.exit(1 if fail else 0)
          EOF

      - name: Photo storage canary (1 GB limit; plan v2 lifted from 100 MB)
        run: |
          python3 - <<'EOF'
          import os, sys, json
          from pathlib import Path
          from datetime import datetime, timezone

          photos = Path("web/photos")
          if not photos.exists():
              print("Photo storage canary: no photos directory yet — OK")
              sys.exit(0)

          # Sum .jpg sizes, excluding _archive/
          total = sum(
              f.stat().st_size for f in photos.rglob("*.jpg")
              if "_archive" not in f.parts
          )
          mb = total / (1024 * 1024)

          # Append to size history log
          log = Path("web/data/photo_storage_size.jsonl")
          with log.open("a", encoding="utf-8") as f:
              f.write(json.dumps({"ts": datetime.now(timezone.utc).isoformat(), "mb": round(mb, 2)}) + "\n")

          # Limit lifted from 100 MB → 1024 MB (1 GB) when plan v2 landed:
          # the new hires pipeline writes to web/photos-hires/ (separate
          # canary below) but the existing pipeline now also backfills all
          # 832 listings with .hero.jpg derivatives on next run, growing
          # this directory by ~400 MB. See cuddly-pondering-frost.md.
          LIMIT_MB = 1024
          print(f"Photo storage: {mb:.1f} MB (limit {LIMIT_MB} MB)")
          if mb > LIMIT_MB:
              print(f"CANARY FAIL: photo storage exceeds {LIMIT_MB} MB — migrate to external storage", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Hires photo storage canary (1 GB limit; plan v2)
        run: |
          python3 - <<'EOF'
          import os, sys, json
          from pathlib import Path
          from datetime import datetime, timezone

          photos_hires = Path("web/photos-hires")
          if not photos_hires.exists():
              print("Hires photo storage canary: no photos-hires directory yet — OK")
              sys.exit(0)

          total = sum(f.stat().st_size for f in photos_hires.rglob("*.jpg"))
          mb = total / (1024 * 1024)

          log = Path("web/data/hires_storage_size.jsonl")
          with log.open("a", encoding="utf-8") as f:
              f.write(json.dumps({"ts": datetime.now(timezone.utc).isoformat(), "mb": round(mb, 2)}) + "\n")

          LIMIT_MB = 1024
          print(f"Hires photo storage: {mb:.1f} MB (limit {LIMIT_MB} MB)")
          if mb > LIMIT_MB:
              print(f"CANARY FAIL: hires photo storage exceeds {LIMIT_MB} MB — migrate to Vercel Blob (see TODOS.md [hires-storage])", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Hires pipeline health canary (plan v2)
        run: |
          python3 - <<'EOF'
          import os, sys, json
          from pathlib import Path

          # Only fire when hires is supposed to be running. If disabled,
          # the metrics file simply doesn't grow.
          if os.environ.get("PULPO_HIRES_ENABLED", "0") in ("", "0", "false", "no"):
              print("Hires pipeline canary: PULPO_HIRES_ENABLED is off — OK")
              sys.exit(0)

          metrics_path = Path("web/data/hires_pipeline_metrics.jsonl")
          if not metrics_path.exists():
              print("CANARY FAIL: PULPO_HIRES_ENABLED=1 but no hires_pipeline_metrics.jsonl found — the step didn't write its summary row", file=sys.stderr)
              sys.exit(1)

          # Read the last JSONL row.
          last_line = None
          with metrics_path.open("r", encoding="utf-8") as f:
              for ln in f:
                  ln = ln.strip()
                  if ln:
                      last_line = ln
          if not last_line:
              print("CANARY FAIL: hires_pipeline_metrics.jsonl exists but is empty", file=sys.stderr)
              sys.exit(1)

          try:
              row = json.loads(last_line)
          except json.JSONDecodeError as e:
              print(f"CANARY FAIL: last hires metrics row is invalid JSON: {e}", file=sys.stderr)
              sys.exit(1)

          results = row.get("results", {})
          attempted = results.get("attempted", 0)
          errored = results.get("error", 0)
          if attempted < 1:
              print(f"CANARY FAIL: hires step attempted={attempted} (silent no-op despite enabled)", file=sys.stderr)
              sys.exit(1)
          if attempted > 0 and (errored / attempted) > 0.5:
              print(f"CANARY FAIL: hires error rate {errored}/{attempted} > 50% (broker-side broken)", file=sys.stderr)
              sys.exit(1)
          print(f"Hires pipeline canary OK: attempted={attempted} ok={results.get('ok',0)} error={errored}")
          EOF

      - name: Hero variant canary (LCP-fix dependency)
        # Phase-C bedding-in: continue-on-error keeps fresh catalogue data
        # shipping while R7 decouples photo refresh from the critical path.
        # REMOVE 2026-06-13 after 7 green post-Phase-C nightlies, or sooner
        # once the hero canary accepts cached OR fresh variants.
        continue-on-error: true
        # Regression guard for the home-hero LCP fix (PR-perf-hero,
        # 2026-05-21). HeroV4 routes the home hero through /api/img,
        # which fetches `/photos/<id>.hero.jpg` (the pipeline-generated
        # 1080² variant). If the pipeline ever stops writing
        # `.hero.jpg` next to `<id>.jpg`, /api/img 404s and the hero
        # falls back to the broker URL (photos[0]) — the exact 14.5 s
        # P95 LCP regression we just closed.
        #
        # Scope: --top-only 10.
        # ─────────────────────
        # web/app/home/HeroV4.jsx:75 reads `pickTopRanked(listings, 10)`
        # — the hero rotator + HomeShelf's Top-10 shelf both consume
        # exactly the global top 10 by rank_score. The previous
        # --top-only 200 was over-broad: a missing .hero.jpg at rank
        # 50-200 cannot drive an LCP regression on the homepage hero
        # (those listings never render as the hero) yet blocked the
        # nightly's commit. That false-alarm class kept the data PR
        # frozen for 5+ nightlies in a row (2026-05-27 → 2026-05-31).
        # Narrowing to top 10 = exact hero-photo contract; misses at
        # rank 11+ degrade gracefully via /api/img's broker fallback
        # on the per-listing detail page where they're still seen.
        #
        # Hard fail by design: a miss inside the top 10 IS a real
        # homepage LCP regression. Do not soft-fail this canary; the
        # cost of a stale ranked.json is bounded (Vercel keeps serving
        # yesterday's commit) and capped by PR-NR-D's pre-canary
        # Slack alert.
        run: |
          python3 -m pulpo.cli check-hero-variants --top-only 10 \
            || { echo "::error::hero variant canary FAILED — see logs above"; exit 1; }

      - name: Snapshot ranked.json to Vercel Blob (post-canary, pre-commit)
        # PR-8 of the reliability plan — durable backup of every nightly's
        # canary-validated ranked.json. Lives AFTER the canaries pass but
        # BEFORE the data PR commit so a bad nightly (canary-blocked)
        # never gets snapshotted; a good nightly gets snapshotted even if
        # the commit step later fails.
        #
        # Best-effort: a snapshot failure does NOT fail the nightly. The
        # script catches its own errors and exits 0 with the cause logged
        # to stderr. BLOB_READ_WRITE_TOKEN unset = no-op (the script
        # detects + warns), so workflows without Blob configured pass
        # cleanly.
        #
        # Retention: 90 days. Storage envelope at ~2 MB × 90 = 180 MB,
        # well inside the 1 GB Vercel Blob free tier. If retention needs
        # to expand later (e.g. forensic recovery beyond 90d), bump the
        # --prune-older-than value.
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          # Make sure the Node SDK is installed. npm install on the
          # nightly runner is cheap (~10s) and avoids needing a separate
          # cache step.
          npm install --no-audit --no-fund --no-save @vercel/blob >/dev/null 2>&1 \
            || echo "::warning::npm install @vercel/blob failed — snapshot may no-op"
          node scripts/snapshot_ranked_json.mjs
          node scripts/snapshot_ranked_json.mjs --prune-older-than 90

      - name: Commit refreshed data via PR
        id: commit
        env:
          GH_TOKEN: ${{ secrets.PULPO_BOT_TOKEN || github.token }}
        run: |
          git config user.name "pulpo-bot"
          git config user.email "bot@pulpo.club"
          git add web/data/ranked.json \
                  web/data/ranked.list.json \
                  web/data/last_updated.json web/data/run_history.json \
                  web/data/parser_errors.log web/data/validation_log.jsonl \
                  samples/ranked.csv
          # PRD P1-1 — featured.json had been stale since 2026-05-08 because
          # `pulpo.featured_listing.write_featured_json` writes a fresh pick
          # every nightly but this commit step never staged the file. PA's
          # `featured.PA.json` is covered in the multi-country block below;
          # SV's gets the same treatment.
          git add web/data/featured.json 2>/dev/null || true
          # PR-MC-PA-3 — multi-country outputs from the PA pipeline
          # run. Best-effort: PA file absence does not block the commit
          # (continue-on-error on the PA pipeline step above means PA
          # data may be missing some nights). When pa.pulpo.club is
          # provisioned, these files become its source of truth.
          for f in ranked.PA.json ranked.list.PA.json \
                   last_updated.PA.json featured.PA.json; do
            git add "web/data/$f" 2>/dev/null || true
          done
          # Optional files — only add if they exist
          git add web/data/photo_fetch_log.jsonl 2>/dev/null || true
          git add web/data/photo_storage_size.jsonl 2>/dev/null || true
          # Plan v2 — hires pipeline outputs
          git add web/data/hires_pipeline_metrics.jsonl 2>/dev/null || true
          git add web/data/hires_storage_size.jsonl 2>/dev/null || true
          git add web/data/prd_feasibility.json 2>/dev/null || true
          git add web/data/prd_feasibility.md 2>/dev/null || true
          git add web/data/source_health_history.jsonl 2>/dev/null || true
          git add web/data/type_classifier_log.jsonl 2>/dev/null || true
          git add web/data/prices_history.json 2>/dev/null || true
          git add web/data/ai_enrichment_cache.json 2>/dev/null || true
          git add web/data/zone_medians_history.jsonl 2>/dev/null || true
          git add web/data/distance_fields_history.jsonl 2>/dev/null || true
          # PRD P1-2 — photo contract sidecar + append-only audit log.
          # `photo_contract.json` carries the latest run's stats and is
          # consumed by /api/nightly/health.
          git add web/data/photo_contract.json 2>/dev/null || true
          git add web/data/photo_contract_log.jsonl 2>/dev/null || true
          # PRD "Inventory Expansion & Listing Quality Filter" — per-shelf
          # eligibility audit + KPI dashboard. Read-only telemetry; the
          # before/after diff between two nightly snapshots is the
          # acceptance deliverable for the inventory-expansion workstream.
          git add web/data/shelf_audit.json 2>/dev/null || true
          git add web/data/kpi_dashboard.json 2>/dev/null || true
          # PRD B1 — per-scrape coverage log (kept / target_discovered /
          # status). Phase C scrapers consume this via lib/coverage_logger
          # to track stated-vs-actual inventory each nightly.
          git add web/data/scraper_coverage_history.jsonl 2>/dev/null || true
          # PRD D1 — per-source dedup audit. Content-fingerprint based;
          # complementary to the phone/coord pair detector. Drives the
          # PRD acceptance criterion "dedup rate documented per source."
          git add web/data/dedup_audit.json 2>/dev/null || true
          # DeepSeek single-call enrichment sidecar + per-event log.
          # Sidecar enables incremental enrichment across nights
          # (cache_hits=0 is currently costing ~$12/mo). Log captures
          # the actual response payload on schema_invalid failures so
          # they can be debugged without re-running the pipeline.
          git add web/data/llm_enrichment.json 2>/dev/null || true
          git add web/data/llm_enrichment_log.jsonl 2>/dev/null || true
          git add "web/photos/" 2>/dev/null || true
          # Plan v2 — hires derivatives + sidecars + quarantine markers + hash cache
          git add "web/photos-hires/" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main is PR-protected — push to a dated branch and auto-merge a PR.
          BRANCH="chore/nightly-data-$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git commit -m "chore(data): nightly run $(date -u +%Y-%m-%d)"
          # Rebase onto the freshest origin/main before pushing. A long
          # pipeline (cold-cache LLM enrichment runs ~50-100 min) can let
          # an unrelated PR land on main between checkout and push. When
          # the PR touched .github/workflows/, GitHub's PAT-scope check
          # treats the data branch's older workflow blobs as a "workflow
          # update" and rejects the push with:
          #
          #   ! [remote rejected] chore/nightly-data-... (refusing to allow
          #   a Personal Access Token to create or update workflow `.github/
          #   workflows/<name>.yml` without `workflow` scope)
          #
          # PULPO_BOT_TOKEN intentionally lacks `workflow` scope (least-
          # privilege; this PAT only writes data + photos). Rebasing onto
          # the new tip brings in those workflow changes so the data
          # commit replays on top, and the resulting branch diff is data-
          # only — no `workflow` scope needed. The data commit never
          # conflicts because the pipeline doesn't touch .github/.
          #
          # First observed: nightly 26758631085 on 2026-06-01, blocked by
          # PR #602 landing mid-run.
          git fetch origin main
          # --autostash is required: the pipeline writes several files
          # NOT included in the data-PR commit (most notably
          # web/data/unmapped_beaches_history.jsonl, repick_summary.jsonl,
          # and various working-tree byproducts). Without --autostash the
          # rebase aborts with "cannot rebase: You have unstaged changes",
          # the fallback push runs against a stale base, and the PAT-scope
          # check rejects the push when origin/main has moved into
          # .github/workflows/. Observed live in nightly 26781987375 after
          # PRs #618 + #620 landed mid-run on 2026-06-01.
          # The auto-stashed working-tree changes are intentionally
          # discarded with the runner — they were never destined for main.
          git rebase --autostash origin/main || {
              echo "::warning::rebase onto origin/main failed; aborting and pushing as-is — push may be PAT-scope rejected if main moved."
              git rebase --abort || true
          }
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(data): nightly run $(date -u +%Y-%m-%d)" \
            --body "Automated nightly data refresh. No code changes."
          # GitHub suppresses Actions triggered by a GITHUB_TOKEN-authored
          # push (anti-recursion). When PULPO_BOT_TOKEN is unset/expired
          # the data-only PR sits forever waiting on the required `pytest`
          # check that never fires (observed on PR #68). Force the dispatch
          # so the required check has a status to report against.
          gh workflow run ci.yml --ref "$BRANCH" || true
          gh workflow run tests-required.yml --ref "$BRANCH" || true
          # Try auto-merge; fall back to admin merge for protected branches
          gh pr merge "$BRANCH" --squash --delete-branch --admin || \
            gh pr merge "$BRANCH" --squash --delete-branch --auto
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel
        # Only runs when fresh data was actually committed.
        # Direct vercel deploy --prod: no local build needed — this is a static
        # site (buildCommand = "echo ..."). Skipping vercel build avoids the
        # 'spawn uv ENOENT' error caused by Vercel CLI trying to install Python
        # deps on the runner. VERCEL_TOKEN env var is read automatically by the
        # CLI; no --token flag needed (which was rejected for containing hyphens).
        # vercel.json ignoreCommand stops the GitHub-integration from making a
        # duplicate Blocked deploy for the same bot commit.
        id: deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel deploy --prod --yes

      - name: Nightly summary (story)
        # End-of-run synthesis. Reads run_history.json +
        # source_health_history.jsonl + last_updated.json + ranked.json
        # off the runner and prints a single self-contained block at
        # the bottom of the job log answering: pipeline produced what?
        # per-source health? did the commit + deploy land? what date
        # will pulpo.club show?
        #
        # Runs `if: always()` — every nightly, success or failure, so
        # the post-mortem surface is one scroll-to-bottom instead of
        # grepping 70 min of stdout + three JSONL files.
        #
        # Also writes web/data/nightly_summary.md so the artifact
        # carries the story even when the data commit didn't land.
        if: always()
        env:
          NIGHTLY_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NIGHTLY_COMMITTED: ${{ steps.commit.outputs.committed || 'false' }}
          NIGHTLY_DEPLOY_OUTCOME: ${{ steps.deploy.outcome || 'skipped' }}
        run: |
          python3 scripts/nightly_summary.py --data-dir web/data --write-md \
            || echo "::warning::nightly summary script failed (non-blocking)"

      - name: Upload nightly diagnostics
        # Runs on success AND failure so the auto-repair workflow + a
        # human looking at the run page can always grab the working-tree
        # state, even when the data commit didn't land. Without this the
        # source_health_history.jsonl + validation_log.jsonl from a
        # failed-canary run disappear with the runner.
        #
        # The downstream auto-repair workflow (pulpo-scraper-autorepair.yml)
        # consumes this artifact by name. Bumping the artifact name needs
        # a matching change there or the consumer falls back to committed
        # main.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-diagnostics-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            web/data/source_health_history.jsonl
            web/data/validation_log.jsonl
            web/data/scraper_failures/
            web/data/last_updated.json
            web/data/run_history.json
            web/data/hires_pipeline_metrics.jsonl
            web/data/nightly_summary.md

      - name: Slack on failure or cancellation
        # Final-line alert: any failed OR cancelled step in this job sends
        # a Slack ping with the run URL. The pre-canary source-health
        # alert above covers the per-source detail; this is the "something
        # blocked the deploy and you should look" trip wire. Best-effort:
        # a Slack outage must not mask the underlying failure so we exit 0
        # regardless.
        #
        # 2026-06-05 (PR-S0): added `|| cancelled()` after a multi-day
        # silent freeze where the 120-min job timeout fired mid-PA-
        # pipeline. Cancellation registers as `cancelled()`, not
        # `failure()` — so this step was silently skipped for 3+ nightlies
        # in a row, exactly the failure mode CLAUDE.md "NEVER let the
        # nightly freeze without a Slack page" (post-2026-06-02) was meant
        # to prevent. Pair with the timeout-minutes bump above so timeouts
        # are now rare AND audible when they happen.
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL unset; skipping failure Slack ping."
            exit 0
          fi
          # Distinguish failure vs cancellation in the message body so
          # the responder knows whether to look for a stuck step or a
          # genuinely broken step.
          STATUS_TEXT="FAILED"
          if [ "${{ job.status }}" = "cancelled" ]; then
            STATUS_TEXT="CANCELLED (likely timeout — look at last in-progress step)"
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            "$SLACK_WEBHOOK_URL" \
            -d "$(printf '{"text":"*Pulpo nightly %s* — <%s|view run>"}' "$STATUS_TEXT" "$RUN_URL")" \
            >/dev/null || echo "Slack POST failed (non-blocking)"
